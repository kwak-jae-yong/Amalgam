<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="./css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="box">

        <header>
            <h1><a href="#"><img src="./img/earth.png" alt="오류"></a></h1>
        </header>
        <nav>
            <ul>
                <li><a href="#">홈</a></li>
                <li><a href="#">목적지</a></li>
                <li><a href="#">버킷리스트</a></li>
                <li><a href="#">여행 팁</a></li>
                <li><a href="#">연락</a></li>
            </ul>
        </nav>
        <section class="hero">
            <div class="img_wrap">
                <img src="./img/Guam.png" alt="오류">
            </div>
            <div class="tit_wrap">
                <h2>괌의 해변</h2>
                <p>시원한 바닷속으로</p>
                <a target="_blank" href="https://ko.wikipedia.org/wiki/%EA%B4%8C"> <input type="submit" value="빠져보기" class="btn"></a>
            </div>
        </section>

        <section class="best">
            <h2>최고의 여행지</h2>
            <div class="best_wrap_a">
                <div class="tit_wrap">
                    <h3>푸꾸옥</h3>
                    <p>베트남 휴양지 세계에서 제일 긴 케이블카도 타보아요</p>
                </div>
                <div class="img_wrap"><img src="./img/pukuok.png" alt="오류"></div>
            </div>

            <div class="best_wrap_b">
                <div class="tit_wrap">
                    <h3>후쿠오카</h3>
                    <p>한국인이 자주가는 일본 관광지</p>
                </div>
                <div class="img_wrap"><img src="./img/fukuoka.png" alt="오류"></div>
            </div>
        </section>

        <section class="bucket_list">
            <h2>버킷리스트</h2>
            <ul>
                <li>

                    <label for="hawai"><img src="./img/hawaii.png" alt="오류">하와이</label>
                    <input type="checkbox" name="bucket" id="hawai">
                </li>
                <li>
                    <label for="america"><img src="./img/america.png" alt="오류">미국</label>
                    <input type="checkbox" name="bucket" id="america">
                </li>
                <li>
                    <label for="japan"><img src="./img/japan.png" alt="오류">일본</label>
                    <input type="checkbox" name="bucket" id="japan">
                </li>
                <li>
                    <label for="vietnam"><img src="./img/vietnam.png" alt="오류" class="viet">베트남</label>
                    <input type="checkbox" name="bucket" id="vietnam">
                </li>
                <li>
                    <label for="europe"><img src="./img/europe.png" alt="오류">유럽</label>
                    <input type="checkbox" name="bucket" id="europe">
                </li>
            </ul>
        </section>

        <section class="tip">
            <h2>여행팁</h2>
            <ul>
                <li><img src="./img/Frame 11.png" alt="오류">생수병으로 마시기</li>
                <li><img src="./img/Frame 11.png" alt="오류">노점음식은 비추</li>
            </ul>
        </section>

        <footer>
            <h2>연락처</h2>
            <div class="img_wrap">
                <ul>
                    <li> <img src="./img/Group 11.png" alt="오류">         
                    <li> <img src="./img/Frame 13.png" alt="오류"></li></li>
                </ul>
               
            </div>

        </footer>
    </div>
</body>

</html>
